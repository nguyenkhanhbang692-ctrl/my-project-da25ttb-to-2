<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Thiết kế trang sản phẩm</title>
    <meta charset="utf-8">
    <script src="../js/lib.js"></script>
       
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap');

        :root {
          --matcha:       #4A7C59;
          --matcha-light: #6FAE7C;
          --cacao:        #8B5E3C;
          --cacao-light:  #C4956A;
          --cream:        #FDF8F2;
          --text-dark:    #2C2417;
          --text-light:   #A89080;
          --shadow-soft:  0 4px 20px rgba(74,124,89,0.12);
          --shadow-hover: 0 14px 40px rgba(74,124,89,0.22);
        }

        /* --- Nền trang --- */
        body {
          font-family: 'Be Vietnam Pro', sans-serif;
          background-color: var(--cream);
          color: var(--text-dark);
        }

        .container {
          padding-top: 40px;
          padding-bottom: 60px;
        }

        /* --- Tiêu đề trang trí --- */
        .container h1 {
          font-family: 'Playfair Display', serif;
          font-size: 2.5rem;
          font-weight: 700;
          color: var(--text-dark);
          text-align: center;
          margin-bottom: 32px;
          position: relative;
        }

        /* Gạch dưới trang trí hình chú vịt */
        .container h1::after {
          content: '🦆';
          display: block;
          font-size: 2rem;
          margin-top: 8px;
        }

        /* --- Grid row --- */
        #product-list {
          row-gap: 28px !important;
        }

        /* --- Hiệu ứng xuất hiện trễ từng cột (Staggered Animation) --- */
        #product-list .col {
          opacity: 0; /* Giữ ẩn lúc đầu để mượt mà */
          animation: fadeUp 0.45s ease both;
        }

        #product-list .col:nth-child(1) { animation-delay: 0.05s; }
        #product-list .col:nth-child(2) { animation-delay: 0.10s; }
        #product-list .col:nth-child(3) { animation-delay: 0.15s; }
        #product-list .col:nth-child(4) { animation-delay: 0.20s; }
        #product-list .col:nth-child(5) { animation-delay: 0.25s; }
        #product-list .col:nth-child(6) { animation-delay: 0.30s; }
        #product-list .col:nth-child(7) { animation-delay: 0.35s; }

        /* --- Card chính --- */
        .product-item {
          border: none !important;
          border-radius: 18px !important;
          overflow: hidden;
          box-shadow: var(--shadow-soft);
          transition: transform 0.35s ease, box-shadow 0.35s ease;
          height: 100%;
        }

        .product-item:hover {
          transform: translateY(-8px);
          box-shadow: var(--shadow-hover);
        }

        /* --- Ảnh sản phẩm --- */
        .product-image {
          overflow: hidden;
        }

        .product-item .card-img-top {
          width: 100%;
          height: 200px;
          object-fit: cover;
          transition: transform 0.5s ease;
          display: block;
        }

        .product-item:hover .card-img-top {
          transform: scale(1.07);
        }

        /* --- Card body --- */
        .product-info {
          background: #ffffff !important;
          padding: 18px 20px 22px !important;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        /* --- Tên sản phẩm (h4.card-title) --- */
        .product-info .card-title {
          font-family: 'Playfair Display', serif;
          font-size: 1.1rem;
          font-weight: 600;
          color: var(--text-dark);
          margin-bottom: 4px;
        }

        /* --- Giá (h5.card-text) --- */
        .product-info h5.card-text {
          font-size: 1.15rem;
          font-weight: 700;
          color: var(--matcha);
          margin: 0;
        }

        .product-info h5.card-text::after {
          content: ' đ';
          font-size: 0.8rem;
          font-weight: 400;
          color: var(--cacao-light);
        }

        /* --- Mô tả (p.card-text) --- */
        .product-info p.card-text {
          font-size: 0.85rem;
          color: var(--text-light);
          line-height: 1.55;
          flex: 1;
        }

        /* --- Nút "Xem chi tiết" --- */
        .product-info .btn-info {
          background: linear-gradient(135deg, var(--matcha), var(--matcha-light)) !important;
          color: #fff !important;
          border: none !important;
          border-radius: 50px !important;
          padding: 9px 22px !important;
          font-size: 0.875rem;
          font-weight: 600;
          box-shadow: 0 4px 14px rgba(74,124,89,0.28);
          transition: background 0.3s ease, transform 0.2s ease;
          align-self: flex-start;
          margin-top: 10px;
          text-decoration: none;
        }

        .product-info .btn-info:hover {
          background: linear-gradient(135deg, var(--cacao), var(--cacao-light)) !important;
          transform: translateY(-2px);
          color: #fff !important;
        }

        /* --- Định nghĩa Animation --- */
        @keyframes fadeUp {
          from { 
            opacity: 0; 
            transform: translateY(25px); 
          }
          to { 
            opacity: 1; 
            transform: translateY(0); 
          }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>THỰC ĐƠN ĐẶC SẮC</h1> 

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4" id="product-list">
            </div>
    </div> 

    <script>
        loadAllProduct();
    </script>  
</body>
</html>
